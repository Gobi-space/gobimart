<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name + ' - GOBIMART'}">Product Details - GOBIMART</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
    <div class="container">

        <!-- Flash messages -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <div style="margin-bottom: 1.5rem;">
            <a th:href="@{/products}" style="color: var(--gray-700); text-decoration: none; font-weight: 600;">&larr; Back to Products</a>
        </div>

        <div class="detail-layout">
            <!-- Product Image -->
            <div class="detail-image-box">
                <img th:src="${product.imageUrl != null and !product.imageUrl.isEmpty() ? product.imageUrl : 'https://placehold.co/600x400?text=Product'}"
                     th:alt="${product.name}">
            </div>

            <!-- Product Info -->
            <div class="detail-info">
                <div class="detail-category" th:text="${product.category}">Category</div>
                <h1 class="detail-title" th:text="${product.name}">Product Name</h1>

                <div class="detail-price">
                    ₹<span th:text="${#numbers.formatDecimal(product.price, 1, 2)}">0.00</span>
                </div>

                <div class="stock-indicator">
                    <span>Availability:</span>
                    <span th:if="${product.isOutOfStock()}" style="color: var(--danger-color); font-weight: 700;">Out of Stock</span>
                    <span th:unless="${product.isOutOfStock()}" style="color: var(--success-color); font-weight: 700;">
                        In Stock (<span th:text="${product.stock}">10</span> available)
                    </span>
                </div>

                <p class="detail-desc" th:text="${product.description}">Detailed product description goes here.</p>

                <!-- Add To Cart Form -->
                <form th:action="@{/cart/add}" method="post">
                    <input type="hidden" name="productId" th:value="${product.id}" />

                    <div class="quantity-control" th:unless="${product.isOutOfStock()}">
                        <label for="quantity" class="form-label" style="margin-bottom: 0;">Quantity:</label>
                        <input type="number"
                               id="quantity"
                               name="quantity"
                               value="1"
                               min="1"
                               th:max="${product.stock}"
                               required />
                    </div>

                    <div>
                        <button type="submit"
                                class="btn btn-primary"
                                style="padding: 0.85rem 2rem; font-size: 1rem;"
                                th:disabled="${product.isOutOfStock()}">
                            <span th:if="${product.isOutOfStock()}">Out of Stock</span>
                            <span th:unless="${product.isOutOfStock()}">Add to Cart</span>
                        </button>
                    </div>
                </form>

            </div>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
