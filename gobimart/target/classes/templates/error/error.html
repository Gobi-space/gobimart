<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - GOBIMART</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
    <div class="container">
        <div style="text-align: center; padding: 5rem 1rem; max-width: 600px; margin: 0 auto;">
            <div style="font-size: 4rem; color: var(--danger-color); line-height: 1;">⚠️</div>
            <h1 style="font-size: 1.8rem; margin: 1rem 0;">Something Went Wrong</h1>
            <p style="color: var(--gray-500); margin-bottom: 2rem;" th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred while processing your request.'}">
                An unexpected error occurred while processing your request.
            </p>
            <div style="display: flex; justify-content: center; gap: 1rem;">
                <a th:href="@{/}" class="btn btn-secondary">Go to Home</a>
                <a th:href="@{/cart}" class="btn btn-primary">Return to Cart</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
