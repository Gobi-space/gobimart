<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - GOBIMART</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
    <div class="container">

        <!-- Flash messages -->
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 2rem; text-align: center;">Secure Checkout</h1>

        <div style="display: grid; grid-template-columns: 3fr 2fr; gap: 2.5rem; max-width: 1000px; margin: 0 auto;">

            <!-- Checkout Form Card -->
            <div class="form-card" style="margin: 0; max-width: 100%;">
                <h2 style="font-size: 1.3rem; margin-bottom: 1.5rem; font-weight: 700;">Customer Information</h2>

                <form th:action="@{/checkout/place-order}" th:object="${checkoutRequest}" method="post">

                    <div class="form-group">
                        <label for="customerName" class="form-label">Full Name *</label>
                        <input type="text"
                               id="customerName"
                               th:field="*{customerName}"
                               class="form-control"
                               placeholder="e.g. Rahul Sharma" />
                        <div th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}" class="form-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email Address *</label>
                        <input type="email"
                               id="email"
                               th:field="*{email}"
                               class="form-control"
                               placeholder="e.g. rahul@example.com" />
                        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="phone" class="form-label">Phone Number *</label>
                        <input type="tel"
                               id="phone"
                               th:field="*{phone}"
                               class="form-control"
                               placeholder="e.g. 9876543210" />
                        <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="form-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="address" class="form-label">Delivery Address *</label>
                        <textarea id="address"
                                  th:field="*{address}"
                                  rows="3"
                                  class="form-control"
                                  placeholder="Enter complete street address, city, and pincode"></textarea>
                        <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="form-error"></div>
                    </div>

                    <!-- Payment Mode Notification -->
                    <div style="background-color: var(--primary-light); padding: 1.25rem; border-radius: var(--border-radius); border: 1px solid #bfdbfe; margin-bottom: 1.5rem;">
                        <h4 style="color: var(--primary-hover); font-size: 0.95rem; margin-bottom: 0.25rem;">Payment Method</h4>
                        <p style="font-size: 0.9rem; color: #1e40af;">
                            <strong>Cash on Delivery (Demo Order)</strong><br>
                            No card or online payment required. Pay upon delivery for demo order purposes.
                        </p>
                    </div>

                    <button type="submit"
                            class="btn btn-primary"
                            style="width: 100%; padding: 0.9rem; font-size: 1.05rem;">
                        Place Order (Cash on Delivery)
                    </button>
                </form>
            </div>

            <!-- Order Review Sidebar -->
            <div class="cart-summary" style="height: fit-content;">
                <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 1rem;">Order Items (<span th:text="${cart.totalQuantity}">1</span>)</h3>

                <div style="max-height: 280px; overflow-y: auto; margin-bottom: 1.25rem; border-bottom: 1px solid var(--gray-200); padding-bottom: 0.5rem;">
                    <div th:each="item : ${cart.items}" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
                        <div>
                            <div style="font-weight: 600; font-size: 0.9rem;" th:text="${item.product.name}">Product Name</div>
                            <div style="font-size: 0.8rem; color: var(--gray-500);">
                                <span th:text="${item.quantity}">1</span> &times; ₹<span th:text="${#numbers.formatDecimal(item.product.price, 1, 2)}">0.00</span>
                            </div>
                        </div>
                        <div style="font-weight: 700; font-size: 0.9rem;">
                            ₹<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}">0.00</span>
                        </div>
                    </div>
                </div>

                <div class="summary-row">
                    <span style="color: var(--gray-500);">Subtotal:</span>
                    <span>₹<span th:text="${#numbers.formatDecimal(cart.totalAmount, 1, 2)}">0.00</span></span>
                </div>

                <div class="summary-row">
                    <span style="color: var(--gray-500);">Delivery:</span>
                    <span style="color: var(--success-color); font-weight: 600;">FREE</span>
                </div>

                <div class="summary-row summary-total">
                    <span>Grand Total:</span>
                    <span style="color: var(--primary-color);">₹<span th:text="${#numbers.formatDecimal(cart.totalAmount, 1, 2)}">0.00</span></span>
                </div>

                <div style="margin-top: 1.5rem; text-align: center;">
                    <a th:href="@{/cart}" style="color: var(--gray-500); text-decoration: none; font-size: 0.85rem;">&larr; Back to cart</a>
                </div>
            </div>

        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
