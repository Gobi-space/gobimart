<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Orders - GOBIMART Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
    <div class="container">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <a th:href="@{/admin}" style="color: var(--gray-500); text-decoration: none; font-size: 0.9rem;">&larr; Admin Dashboard</a>
                <h1 style="font-size: 2rem; font-weight: 800; margin-top: 0.25rem;">All Customer Orders</h1>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(orders)}" style="text-align: center; padding: 4rem 1rem; background: #ffffff; border-radius: var(--border-radius); border: 1px solid var(--gray-200);">
            <div style="font-size: 3rem; margin-bottom: 1rem;">📦</div>
            <h3 style="font-size: 1.4rem; margin-bottom: 0.5rem;">No orders placed yet.</h3>
            <p style="color: var(--gray-500);">Customer orders will appear here once submitted through checkout.</p>
        </div>

        <div th:unless="${#lists.isEmpty(orders)}" style="background-color: #ffffff; border-radius: var(--border-radius); border: 1px solid var(--gray-200); box-shadow: var(--box-shadow); overflow: hidden;">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Order #</th>
                    <th>Customer Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Date</th>
                    <th>Items</th>
                    <th>Total Amount</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td style="font-weight: 700; color: var(--primary-color);">#<span th:text="${order.id}">101</span></td>
                    <td th:text="${order.customerName}">Rahul Sharma</td>
                    <td th:text="${order.email}" style="color: var(--gray-500);">rahul@example.com</td>
                    <td th:text="${order.phone}">9876543210</td>
                    <td th:text="${#temporals.format(order.orderDate, 'dd-MMM-yyyy HH:mm')}">Date</td>
                    <td th:text="${order.items.size()} + ' item(s)'">2 item(s)</td>
                    <td style="font-weight: 700;">₹<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">0.00</span></td>
                    <td>
                        <span style="background-color: #d1fae5; color: #065f46; padding: 0.2rem 0.6rem; border-radius: 4px; font-weight: 700; font-size: 0.8rem;"
                              th:text="${order.status}">PLACED</span>
                    </td>
                    <td>
                        <a th:href="@{/admin/orders/{id}(id=${order.id})}" class="btn btn-outline" style="padding: 0.3rem 0.65rem; font-size: 0.8rem;">View Details</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
