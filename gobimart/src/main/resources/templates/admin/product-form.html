<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Edit Product - GOBIMART Admin' : 'Add Product - GOBIMART Admin'}">Product Form - GOBIMART</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
    <div class="container">

        <!-- Flash messages -->
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <div style="max-width: 650px; margin: 0 auto 1.5rem auto;">
            <a th:href="@{/admin/products}" style="color: var(--gray-500); text-decoration: none; font-size: 0.9rem;">&larr; Back to Products</a>
            <h1 style="font-size: 2rem; font-weight: 800; margin-top: 0.5rem;" th:text="${isEdit ? 'Edit Product' : 'Add New Product'}">Product Form</h1>
        </div>

        <div class="form-card">
            <form th:action="${isEdit} ? @{/admin/products/edit/{id}(id=${productForm.id})} : @{/admin/products/new}"
                  th:object="${productForm}"
                  method="post">

                <input type="hidden" th:if="${isEdit}" th:field="*{id}" />

                <div class="form-group">
                    <label for="name" class="form-label">Product Name *</label>
                    <input type="text"
                           id="name"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="e.g. Wireless Noise-Cancelling Headphones" />
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="form-error"></div>
                </div>

                <div class="form-group">
                    <label for="category" class="form-label">Category *</label>
                    <select id="category" th:field="*{category}" class="form-control">
                        <option value="">-- Select Category --</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat}"
                                th:text="${cat}">Electronics</option>
                    </select>
                    <div th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="form-error"></div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="price" class="form-label">Price (₹) *</label>
                        <input type="number"
                               id="price"
                               step="0.01"
                               min="0.01"
                               th:field="*{price}"
                               class="form-control"
                               placeholder="e.g. 7999.00" />
                        <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="form-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="stock" class="form-label">Stock Quantity *</label>
                        <input type="number"
                               id="stock"
                               min="0"
                               th:field="*{stock}"
                               class="form-control"
                               placeholder="e.g. 25" />
                        <div th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}" class="form-error"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="imageUrl" class="form-label">Image URL</label>
                    <input type="url"
                           id="imageUrl"
                           th:field="*{imageUrl}"
                           class="form-control"
                           placeholder="https://images.unsplash.com/..." />
                    <small style="color: var(--gray-500); font-size: 0.8rem;">Provide a valid image web URL.</small>
                </div>

                <div class="form-group">
                    <label for="description" class="form-label">Description</label>
                    <textarea id="description"
                              th:field="*{description}"
                              rows="4"
                              class="form-control"
                              placeholder="Detailed specifications and features of the product..."></textarea>
                    <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="form-error"></div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                    <a th:href="@{/admin/products}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary" th:text="${isEdit ? 'Save Changes' : 'Create Product'}">Submit</button>
                </div>

            </form>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
