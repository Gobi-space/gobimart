<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - GOBIMART Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
    <div class="container">

        <!-- Flash messages -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <a th:href="@{/admin}" style="color: var(--gray-500); text-decoration: none; font-size: 0.9rem;">&larr; Admin Dashboard</a>
                <h1 style="font-size: 2rem; font-weight: 800; margin-top: 0.25rem;">Product Management</h1>
            </div>
            <a th:href="@{/admin/products/new}" class="btn btn-primary">+ Add New Product</a>
        </div>

        <div style="background-color: #ffffff; border-radius: var(--border-radius); border: 1px solid var(--gray-200); box-shadow: var(--box-shadow); overflow: hidden;">
            <table class="data-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}" style="color: var(--gray-500);">1</td>
                    <td>
                        <img th:src="${product.imageUrl != null and !product.imageUrl.isEmpty() ? product.imageUrl : 'https://placehold.co/60x60?text=Product'}"
                             th:alt="${product.name}"
                             style="width: 45px; height: 45px; object-fit: cover; border-radius: 4px;" />
                    </td>
                    <td>
                        <a th:href="@{/products/{id}(id=${product.id})}"
                           target="_blank"
                           style="font-weight: 600; color: var(--gray-900); text-decoration: none;"
                           th:text="${product.name}">Product Name</a>
                    </td>
                    <td>
                        <span class="category-chip" style="font-size: 0.75rem; padding: 0.2rem 0.6rem;" th:text="${product.category}">Category</span>
                    </td>
                    <td style="font-weight: 700;">
                        ₹<span th:text="${#numbers.formatDecimal(product.price, 1, 2)}">0.00</span>
                    </td>
                    <td>
                        <span th:if="${product.stock <= 0}" style="color: var(--danger-color); font-weight: 700;">Out of Stock</span>
                        <span th:unless="${product.stock <= 0}" th:text="${product.stock}">10</span>
                    </td>
                    <td>
                        <div style="display: flex; gap: 0.5rem;">
                            <a th:href="@{/admin/products/edit/{id}(id=${product.id})}" class="btn btn-secondary" style="padding: 0.3rem 0.65rem; font-size: 0.8rem;">Edit</a>
                            <form th:action="@{/admin/products/delete/{id}(id=${product.id})}" method="post" style="display: inline;" onsubmit="return confirmAction('Are you sure you want to delete this product?');">
                                <button type="submit" class="btn btn-danger" style="padding: 0.3rem 0.65rem; font-size: 0.8rem;">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
